<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf1 100%);
            min-height: 100vh;
        }
        
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.25);
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 12px;
            color: white;
        }
        
        .page-header h1 {
            margin: 0;
            font-weight: 600;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.35);
            color: white;
            text-decoration: none;
        }
        
        .team-member-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .team-member-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        
        .team-member-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .team-member-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        
        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-delete:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #666;
        }
        
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="page-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>👥 Team Members</h1>
                <a href="/team-members/new" class="btn-add">+ Add Team Member</a>
            </div>
        </div>
        
        <div th:if="${teamMembers != null && !teamMembers.isEmpty()}">
            <div th:each="teamMember : ${teamMembers}" class="team-member-card">
                <div class="team-member-name">
                    <div class="team-member-icon" th:text="${teamMember.name.charAt(0)}"></div>
                    <span th:text="${teamMember.name}"></span>
                </div>
                <form th:action="@{/team-members/{id}/delete(id=${teamMember.id})}" method="POST" style="margin: 0;">
                    <button type="submit" class="btn-delete" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </div>
        </div>
        
        <div th:if="${teamMembers == null || teamMembers.isEmpty()}" class="empty-state">
            <div class="empty-state-icon">👤</div>
            <h3>No Team Members Yet</h3>
            <p>Add your first team member to get started!</p>
            <a href="/team-members/new" class="btn-add" style="margin-top: 1rem; display: inline-block;">+ Add Team Member</a>
        </div>
    </div>
</body>
</html>
