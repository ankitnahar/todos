<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Task</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container my-4">

<nav class="mb-4">
    <a class="btn btn-secondary" th:href="@{/tasks}">Back to Task List</a>
    <a class="btn btn-secondary" th:href="@{/tags}">Manage Tags</a>
</nav>

<h2>Add New Task</h2>

<form th:action="@{/tasks/new}" th:object="${task}" method="post" novalidate>
    <div class="mb-3">
        <label for="name" class="form-label">Name *</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" required/>
        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label for="details" class="form-label">Details</label>
        <textarea id="details" th:field="*{details}" rows="4" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" th:field="*{date}" class="form-control" />
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select id="status" th:field="*{status}" class="form-select">
            <option th:each="stat : ${allStatuses}" th:value="${stat}" th:text="${stat}"
                    th:selected="${stat == task.status}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label for="tags" class="form-label">Tags</label>
        <select id="tags" name="tagIds" multiple class="form-select">
            <option th:each="tag : ${allTags}" th:value="${tag.id}" th:text="${tag.name}"></option>
        </select>
    </div>

    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Save Task</button>
        <a class="btn btn-secondary" th:href="@{/tasks}">Cancel</a>
    </div>
</form>

<script>
    // Ensure the date field shows today's date if not already set
    $(document).ready(function() {
        const dateField = document.getElementById('date');
        if (!dateField.value) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const formattedDate = yyyy + '-' + mm + '-' + dd;
            dateField.value = formattedDate;
        }

        // Add Esc key shortcut to return to the main page
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                window.location.href = '/tasks';
            }
        });
    });
</script>

</body>
</html>
