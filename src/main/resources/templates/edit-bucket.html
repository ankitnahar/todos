<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Bucket</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf1 100%);
            min-height: 100vh;
        }
        
        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.25);
            padding: 0.75rem 0;
            margin-bottom: 1rem;
        }
        
        .page-header h1 {
            color: white;
            font-weight: 600;
            font-size: 1.5rem;
            margin: 0;
        }
        
        .color-preview {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            border: 2px solid #dee2e6;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="main-container">
            <h1>✏️ Edit Bucket</h1>
        </div>
    </div>
    
    <div class="main-container mt-4">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/buckets/{id}/edit(id=${bucket.id})}" th:object="${bucket}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group">
                        <label for="name">Bucket Name *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required 
                               placeholder="e.g., Today, Future, Backlog">
                    </div>
                    
                    <div class="form-group">
                        <label for="priority">Priority *</label>
                        <input type="number" class="form-control" id="priority" th:field="*{priority}" required 
                               min="1" placeholder="Lower number = higher priority">
                        <small class="form-text text-muted">Buckets are sorted by priority (1 is highest)</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="color">Color *</label>
                        <div class="d-flex align-items-center gap-2">
                            <input type="color" class="form-control" id="color" th:field="*{color}" 
                                   required style="width: 80px; height: 40px;">
                            <div class="color-preview ml-2" id="colorPreview" th:style="'background-color: ' + ${bucket.color}"></div>
                            <span id="colorValue" class="ml-2" th:text="${bucket.color}"></span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="isDefault" th:field="*{isDefault}">
                            <label class="form-check-label" for="isDefault">Set as Default Bucket</label>
                        </div>
                        <small class="form-text text-muted">New sub-notes will be assigned to the default bucket by default</small>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Update Bucket</button>
                        <a href="/buckets" class="btn btn-secondary ml-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        // Color picker preview
        const colorPicker = document.getElementById('color');
        const colorPreview = document.getElementById('colorPreview');
        const colorValue = document.getElementById('colorValue');
        
        colorPicker.addEventListener('input', function() {
            const color = this.value;
            colorPreview.style.backgroundColor = color;
            colorValue.textContent = color;
        });
        
        // ESC key navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                window.location.href = '/buckets';
            }
        });
    </script>
</body>
</html>
