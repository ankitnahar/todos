<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Details</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container my-4">

<nav class="mb-4">
    <a class="btn btn-secondary" th:href="@{/tasks}">Back to Task List</a>
    <a class="btn btn-secondary" th:href="@{/tags}">Manage Tags</a>
</nav>

<h2>Task Details</h2>

<form th:action="@{'/tasks/' + ${task.id} + '/update'}" method="post" novalidate>
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control" name="name" th:value="${task.name}"/>
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select id="status" name="status" class="form-select">
            <option th:each="stat : ${allStatuses}"
                    th:value="${stat}"
                    th:text="${stat}"
                    th:selected="${stat == task.status}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label for="details" class="form-label">Details</label>
        <textarea id="details" name="details" rows="5" class="form-control" th:text="${task.details}"></textarea>
    </div>

    <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" name="date" class="form-control" th:value="${task.date}"/>
    </div>

    <div class="mb-3">
        <label for="tags" class="form-label">Tags</label>
        <select id="tags" name="tagIds" multiple class="form-select">
            <option th:each="tag : ${allTags}"
                    th:value="${tag.id}"
                    th:text="${tag.name}"
                    th:selected="${task.tags.contains(tag)}"></option>
        </select>
    </div>

    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a class="btn btn-secondary" th:href="@{/tasks}">Cancel</a>
    </div>
</form>

<script>
    $(document).ready(function() {
        // Add Esc key shortcut to return to the main page
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                window.location.href = '/tasks';
            }
        });
    });
</script>

</body>
</html>
