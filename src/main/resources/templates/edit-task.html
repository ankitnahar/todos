<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Task</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container my-4">

<nav class="mb-4">
    <a class="btn btn-secondary" th:href="@{/tasks}">Back to Task List</a>
    <a class="btn btn-secondary" th:href="@{/tags}">Manage Tags</a>
    <a class="btn btn-secondary" th:href="@{/tasks/{id}(id=${task.id})}">View Task</a>
</nav>

<h2>Edit Task</h2>

<form th:action="@{/tasks/{id}/edit(id=${task.id})}" th:object="${task}" method="post" novalidate>
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label for="name" class="form-label">Name *</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" required/>
        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label for="details" class="form-label">Details</label>
        <textarea id="details" th:field="*{details}" rows="4" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" th:field="*{date}" class="form-control" />
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select id="status" th:field="*{status}" class="form-select">
            <option th:each="stat : ${allStatuses}" th:value="${stat}" th:text="${stat}"
                    th:selected="${stat == task.status}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label for="tags" class="form-label">Tags</label>
        <select id="tags" name="tagIds" multiple class="form-select">
            <option th:each="tag : ${allTags}"
                    th:value="${tag.id}"
                    th:text="${tag.name}"
                    th:selected="${task.tags != null && task.tags.contains(tag)}"></option>
        </select>
    </div>

    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Update Task</button>
        <a class="btn btn-secondary" th:href="@{/tasks/{id}(id=${task.id})}">Cancel</a>
    </div>
</form>

<script>
    $(document).ready(function() {
        // Add Esc key shortcut to return to the task detail page
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                window.location.href = '/tasks/' + [[${task.id}]];
            }
        });
    });
</script>

</body>
</html>
